# Build on GitHub, publish to GHCR, deploy with eras-tcg/infra (self-hosted runner in the VPS).
# The image embeds nginx.<env>.conf, so it is built per environment: tag <sha>-staging / <sha>-prod.
#   PR to develop/main -> build only
#   push to develop    -> build staging image + deploy staging
#   push to main       -> build prod image + deploy production (waits for approval)
#   Run workflow       -> redeploy an existing image (rollback)
name: CI/CD

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        required: true
      image_tag:
        description: Commit sha of an image already published (see a previous run)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TARGET_ENV: ${{ (github.ref == 'refs/heads/main' || github.base_ref == 'main') && 'prod' || 'staging' }}
    outputs:
      image: ghcr.io/eras-tcg/eras-frontend:${{ github.sha }}-${{ env.TARGET_ENV }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push on develop/main)
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: ENVIRONMENT=${{ env.TARGET_ENV }}
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/eras-tcg/eras-frontend:${{ github.sha }}-${{ env.TARGET_ENV }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ env.TARGET_ENV }}
          cache-to: type=gha,mode=max,scope=${{ env.TARGET_ENV }}

  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: build
    permissions:
      contents: read
      packages: read
    uses: eras-tcg/infra/.github/workflows/deploy.yml@main
    with:
      service: eras-frontend
      environment: staging
      image: ${{ needs.build.outputs.image }}
      nginx_vhost: nginx/staging.erastcg.com

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    permissions:
      contents: read
      packages: read
    uses: eras-tcg/infra/.github/workflows/deploy.yml@main
    with:
      service: eras-frontend
      environment: production
      image: ${{ needs.build.outputs.image }}
      nginx_vhost: nginx/erastcg.com

  redeploy:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: read
    uses: eras-tcg/infra/.github/workflows/deploy.yml@main
    with:
      service: eras-frontend
      environment: ${{ inputs.environment }}
      image: ghcr.io/eras-tcg/eras-frontend:${{ inputs.image_tag }}-${{ inputs.environment == 'production' && 'prod' || 'staging' }}
      nginx_vhost: ${{ inputs.environment == 'production' && 'nginx/erastcg.com' || 'nginx/staging.erastcg.com' }}
